name: Level Life Reminders

on:
  workflow_dispatch:
    inputs:
      reminder:
        description: Reminder endpoint to trigger
        required: true
        default: both
        type: choice
        options:
          - morning
          - evening
          - both

jobs:
  reminder:
    runs-on: ubuntu-latest

    env:
      APP_URL: https://levellife.net
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Scheduler note
        run: |
          echo "cron-job.org is the primary production scheduler."
          echo "This GitHub Actions workflow is a manual backup/debug trigger only."

      - name: Morning reminder
        if: ${{ inputs.reminder == 'morning' || inputs.reminder == 'both' }}
        run: |
          test -n "$CRON_SECRET"
          curl -fsS --retry 3 --retry-delay 10 "${APP_URL}/internal/cron/notifications/morning?token=${CRON_SECRET}"

      - name: Evening reminder
        if: ${{ inputs.reminder == 'evening' || inputs.reminder == 'both' }}
        run: |
          test -n "$CRON_SECRET"
          curl -fsS --retry 3 --retry-delay 10 "${APP_URL}/internal/cron/notifications/evening?token=${CRON_SECRET}"
